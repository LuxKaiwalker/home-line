az_step_deg: 0.25
az_step_coarse_deg: 1.0            # F22 coarse search
sampling:
  - {to_m: 2000,  step_m: 1,   source: dem_1m}
  - {to_m: 30000, step_m: 20,  source: ctx_20m}
  - {to_m: 80000, step_m: 200, source: mola_hrsc_200m}
curvature: "drop = d^2 / (2 R)"
eye_height_m: 1.7
navcam_height_m: 1.9               # verify_at_h0 from camera model C-vector
distance_classes_km: [0.5, 2.0]
v2: {min_stops: 10, target_stops: 30, manual_check_frac: 0.2}
sky_detector: "per column, top-down: first pixel where vertical gradient > 3x the median gradient of the top 10% rows"

# --- WS3 additions (fresh run, 2026-11-14; each assumed: true and flagged in STATUS.md) ------
# Ray engine: DEM bands are north-up rasters in the analysis CRS (site.yaml); a sample with no
# data in its configured source falls back to the next coarser source given (never finer).
band_fallback: {value: coarser, assumed: true}
# Raw-image API facts verified by D0 today (docs/discovery.md 3.3, 3.3a, 3.4); cited, not assumed.
navcam_api:
  url: "https://mars.nasa.gov/api/v1/raw_image_items/"   # 3.3, no key needed
  camera_model_field: camera_model_component_list        # 3.3: "C;A;H;V;O;R"
  camera_frame: "rover frame, +X forward, +Y right, +Z down"                          # 3.3a
  attitude: "quaternion (w, x, y, z), rover -> site (N, E, Down); ZYX Euler = MMGIS yaw/pitch/roll"  # 3.3a
  lmst_format: "Sol-NNNNNMhh:mm:ss.sss"                  # 3.3
  downsampled_models_in_downsampled_px: true             # 3.3
  c_height_above_rover_origin_m: {median_near_horizontal: 1.924, min: 1.835, max: 2.026}  # 3.4
# Navcam frame selection and cache (data/raw/navcam/). WS3 assumptions, flagged in STATUS.md.
navcam_selection:
  instruments: [NAV_LEFT_B]        # left eye only: the right eye has the same pointing; halves downloads
  sample_types: [full]             # API filter extended=full::sample_type::eq (checked by WS3 on sol 4200: 48/48 full)
  per_page: 200                    # 3.3: per_page=200 works
  stops_wanted: 36                 # v2.target_stops (30) + 20% for frames the detector fails on
  max_stops_tried: 120              # all 116 distinct focus-area stops at 30 m spacing (WS3 run 1: 11/70 had a frame with sky)
  max_frames_per_stop: 4           # widest azimuth spread among frames that pass the sky test
  min_stop_spacing_m: 30           # distinct stops: farthest-point order over focus-area drive ends
  first_stops:                     # stations.yaml rules that name a drive end go first
    - {station: S4, nearest_sol: 4200}   # S4 rule "Curiosity drive end nearest sol 4200 from MMGIS"
  top_row_min_el_deg: 10.0         # frame's top-centre pixel at least this far above local level (sky in frame)
  bottom_row_max_el_deg: -5.0      # ... and its bottom-centre pixel at most this (ground in frame)
  max_extra_sols: 1                # also look at drive-end sol + 1 if the drive-end sol has no usable frame
  max_total_mb: 150                # cache budget for API JSON + JPG
  timeout_s: 60
  retries: 2
  assumed: true
# Structured copy of the sky_detector rule above (same numbers: 3x, top 10% rows) so code does not
# parse prose, plus WS3 additions justified on fresh frames (see STATUS.md WS3 for the evidence):
#  zero_median_guard: a zero reference median (smooth 8-bit sky) uses one DN instead.
#  border_px: Navcam JPEG artefact border (fresh cache, 12 frames: row 0 ~235-254 DN, row 1
#             ~20 DN above row 2, column 0 ~25 DN darker, last row bright 141-252 DN).
#  presmooth_sigma_px: Gaussian pre-smoothing before the gradient; 0 = rule as written.
sky_detector_params: {grad_ratio: 3.0, ref_top_frac: 0.10, zero_median_guard: one_count,
                      border_px: 2, presmooth_sigma_px: 2.0, assumed: true}
