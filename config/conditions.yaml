rad:
  dataset: MSL_RAD_OBS-L2
  dose_variable: DOSIMETRY_TOTAL_f   # docs/discovery.md §4.1/§7: quality-filtered dose rates, uGy/day, fill -1e31
  dose_component: TOTAL_DOSE_E       # WS4 (assumed): discovery.md §4.1, the only column that reproduces `expected`; PENDING G's confirmation
  time_tag: start                    # WS4 (assumed): discovery.md §4.1 infers EPOCH = observation start (not stated in the metadata)
  source_api: "https://cdaweb.gsfc.nasa.gov/WS/cdasr/1/dataviews/sp_phys/datasets"  # discovery.md §4.1: RAD L2 is not on HAPI; CDAS REST
  latest_window_days: 30             # brief WS4 task 1: "last 30 days"
  sample_duration: "gap to the next record, capped at the median spacing; the last record repeats the one before"  # WS4 (assumed): cadence 17 min, ~8 min in storms (discovery.md §4.1)
  storm_window_utc: ["2024-05-19T00:00:00Z", "2024-05-23T00:00:00Z"]
  baseline: "median of the 7 days before the storm window"
  tripwire: {factor: 3.0, consecutive_samples: 2, fires_at: "end of the last qualifying sample"}  # fires_at: WS4 (assumed)
  q_sep: 1.0                       # never 3 for the SEP
  interpolation: "linear between sample midpoints"
  event_bounds: "baseline crossings either side of the peak; the storm-window end if still above baseline"  # WS4 (assumed): limits of the excess integral
  expected: {peak_mgy_day: [8.1, 8.4], excess_mgy: [1.7, 1.9]}
  assumed: [dose_component, time_tag, sample_duration, tripwire.fires_at, event_bounds]   # added by WS4; G to confirm
leash:
  d_allow_mgy: 0.5                 # decided (D9), slider 0.25-1.0
  d_allow_range_mgy: [0.25, 1.0]   # D9 slider range (the note above)
  d_allow_step_mgy: 0.05           # WS4 (assumed): slider step; rad.json leash.table has one row per step
  formula: "tau_dose_min = 60 * D_allow / Ddot_mGy_per_h"
  assumed: [d_allow_step_mgy]      # added by WS4
rems:
  ls_window_deg: [10, 35]
  feed_stale_since: "2026-08-25"   # D0 confirmed: latest feed sol 4995 = 2026-08-25 (discovery.md §4.2)
  feed_url: "https://mars.nasa.gov/rss/api/?feed=weather&category=msl&feedtype=json"   # discovery.md §4.2
  pds_base_url: "https://atmos.nmsu.edu/PDS/data/mslrem_1001/DATA"                    # discovery.md §4.2 (RMD = MODRDR)
  pds_rmd_record_bytes: 372        # discovery.md §4.2 (LABEL/MODRDR6.FMT RECORD_BYTES)
  pds_mars_years: [36, 37, 38]     # WS4 (assumed): the three latest MYs whose Ls 10-35 window is in PDS (PDS ends at sol 4843)
  pds_rows_per_sol: 200            # WS4 (assumed): evenly spaced MODRDR rows read per sol (one multi-range request), keeps the cache < 50 MB
  pds_min_lmst_coverage_h: 18      # WS4 (assumed): a sol's min/max counts only if its valid rows cover >= 18 distinct LMST hours
  assumed: [pds_mars_years, pds_rows_per_sol, pds_min_lmst_coverage_h]   # added by WS4; G to confirm
donki:
  base_url: "https://api.nasa.gov/DONKI"   # discovery.md §4.3; key from NASA_API_KEY, never stored
  endpoints: {CME: "CME", WSAEnlilSimulations: "WSAEnlilSimulations", notifications: "notifications?type=all", SEP: "SEP", IPS: "IPS"}
  window_utc: ["2024-05-12T00:00:00Z", "2024-05-23T00:00:00Z"]   # WS4 (assumed): RAD baseline week + storm window
  label: "context only, not a trigger"
  assumed: [window_utc]            # added by WS4
horizons:
  api_url: "https://ssd.jpl.nasa.gov/api/horizons.api"   # discovery.md §4.4; quantity 21 = one-way down-leg light time
  window_utc: ["2026-11-14T00:00:00Z", "2026-11-16T00:00:00Z"]   # event weekend (discovery.md §4.4)
  step: "1 h"                      # WS4 (assumed): table spacing; linear in between
  assumed: [step]                  # added by WS4
clock:
  algorithm: "Mars24 (Allison and McEwen 2000)"
  gale_lon_east_deg: 137.4085      # WS4: docs/discovery.md §4.5/§7, MSL label LMST = Mars24 at 137.4085 E (137.39 gave a +4.4 s bias); G to review
  site: "config/site.yaml pad_default"   # WS4: lat/lon for the Gale sun, sunrise and sunset (stations pass their own)
  sun_horizon_elevation_deg: 0.0   # WS4 (assumed): flat-horizon sunrise/sunset = sun centre at 0 deg; station daylight uses the F12 horizon
  mars_year_epoch_utc: "1955-04-11T00:00:00Z"  # MY 1 starts at Ls 0 on 1955-04-11 (Clancy et al. 2000)
  msl_landing_utc: "2012-08-06T05:17:57Z"   # Curiosity touchdown, spacecraft event time (NASA/JPL); mission sol 0, for msl_sol()
  eva_start_lmst_h: 9.0           # WS4 (assumed): simulated EVA starts 09:00 LMST; nothing in SPEC fixes it; C/S to confirm
  eva_sol_ref_utc: "2026-11-14T08:00:00Z"   # WS4 (assumed): the EVA sol is the local Gale sol containing H0 (event.yaml h0_utc)
  sun_series_step_min: 5           # WS4 (assumed): clock.json EVA sun-series spacing
  assumed: [sun_horizon_elevation_deg, eva_start_lmst_h, eva_sol_ref_utc, sun_series_step_min]   # added by WS4
event_weekend: {ls_deg: 22, mars_year: 39}
