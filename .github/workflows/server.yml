# Backend CI (optional live layer, D48). Same triggers as ci.yml, but a separate workflow on
# purpose: pages.yml deploys after the "ci" workflow only, so a red backend test can never block
# the static Pages deploy (the static fallback never depends on the backend; kit "never cut").
# Synthetic parity is the CI half of D56/K3; real-data parity (`make parity`) runs locally and in
# deploy.sh. Both targets pass while server/ or the parity tests do not exist yet ("no tests
# collected" is ok) and pick them up once they land. server/ and tests/test_backend_*.py are kept
# out of a plain pytest (pyproject.toml), so the ci "python" job does not run them; they run here.
name: server

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR merge commit and its parents, so HEAD^1 is the base tip
      - name: Relevance gate (D129, D134; on PRs into design the steps below skip when nothing this job tests changed)
        id: gate
        env:
          RELEVANT: '^(pipeline/|server/|contracts/|config/|\.github/workflows/)' # D134 CI diet
          IGNORE: '^$'
        run: |
          # PR: diff the merge commit against its first parent (the base tip), i.e. what the PR changes
          # on top of $GITHUB_BASE_REF. Push, PR into main (promotion, D134), no diff, or an empty diff:
          # run (when in doubt, run).
          run=true; why="event $GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_BASE_REF" = main ]; then
            why="promotion PR into main: full suite (D134)"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if ! files=$(git diff --name-only HEAD^1 HEAD); then why="diff unavailable"
            elif [ -z "$files" ]; then why="empty diff"
            else
              hits=$(printf '%s\n' "$files" | grep -E "$RELEVANT" | grep -vE "$IGNORE" || true)
              if [ -n "$hits" ]; then why="relevant changes vs $GITHUB_BASE_REF:"$'\n'"$hits"
              else run=false; why="nothing this job tests changed vs $GITHUB_BASE_REF; steps skipped, job stays green"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run ($why)"
      - if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - if: steps.gate.outputs.run == 'true'
        name: Install Python 3.11 and deps (dev + server groups)
        run: uv sync --locked -p 3.11 --group server
      - if: steps.gate.outputs.run == 'true'
        name: Server deps import
        run: uv run --no-sync python -c "import fastapi, httpx, jwt, psycopg, pydantic, uvicorn"
      - if: steps.gate.outputs.run == 'true'
        name: Backend tests (make server-test)
        run: make server-test
      - if: steps.gate.outputs.run == 'true'
        name: Synthetic parity, batch == server (make parity-synthetic; D56)
        run: make parity-synthetic
